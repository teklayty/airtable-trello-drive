<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark Read</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      color: #172b4d;
      background: #fff;
    }

    #status {
      margin-bottom: 14px;
      line-height: 1.4;
      font-size: 14px;
    }

    .mark-read {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 8px;
      border: 0;
      border-radius: 3px;
      background: #0c66e4;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .mark-read:hover {
      background: #0055cc;
    }

    .mark-read:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>

<body>

  <div id="status">
    Choose which message type you want to mark as read.
  </div>

  <button id="mark-whatsapp-read" class="mark-read" type="button">
    Mark WhatsApp Read
  </button>

  <button id="mark-outlook-read" class="mark-read" type="button">
    Mark Outlook Read
  </button>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    (function () {
      "use strict";

      const POWERUP_APP_NAME =
        "WhatsApp + Outlook New Message - Mark Read";

      const POWERUP_APP_KEY =
        "99fb195773ddc1e3bfbd79de31dd8647";

      const status =
        document.getElementById("status");

      const whatsappButton =
        document.getElementById("mark-whatsapp-read");

      const outlookButton =
        document.getElementById("mark-outlook-read");

      /*
       * This is the secondary Power-Up iframe.
       * The App Key is required here because this iframe
       * uses the REST API client.
       */
      const t = window.TrelloPowerUp.iframe({
        appKey: POWERUP_APP_KEY,
        appName: POWERUP_APP_NAME
      });

      function setStatus(message) {
        status.textContent = message;
      }

      function findLabel(labels, labelName) {
        if (!Array.isArray(labels)) {
          return null;
        }

        return (
          labels.find(function (label) {
            return (
              label &&
              typeof label.name === "string" &&
              label.name.trim().toLowerCase() ===
                labelName.toLowerCase()
            );
          }) || null
        );
      }

      async function run(labelName, button) {
        button.disabled = true;
        setStatus('Checking the card for "' + labelName + '"...');

        try {
          /*
           * Get the current card and its labels.
           */
          const card = await t.card(
            "id",
            "name",
            "labels"
          );

          if (!card || !card.id) {
            throw new Error(
              "Could not determine the current Trello card."
            );
          }

          const label =
            findLabel(card.labels, labelName);

          if (!label || !label.id) {
            setStatus(
              'The "' + labelName + '" label is already absent from this card.'
            );

            button.disabled = false;
            return;
          }

          /*
           * Get Trello's REST API client.
           */
          setStatus(
            "Checking Trello authorization..."
          );

          const rest =
            await t.getRestApi();

          /*
           * See whether this Power-Up has already
           * been authorized by the current member.
           */
          let authorized =
            await rest.isAuthorized();

          /*
           * Authorization must be initiated as a
           * consequence of this actual user click.
           */
          if (!authorized) {
            setStatus(
              "Opening Trello authorization..."
            );

            await rest.authorize({
              scope: "read,write",
              expiration: "never"
            });

            authorized =
              await rest.isAuthorized();
          }

          if (!authorized) {
            throw new Error(
              "Trello authorization was not completed."
            );
          }

          /*
           * Retrieve the user token.
           */
          setStatus(
            "Getting Trello authorization token..."
          );

          const token =
            await rest.getToken();

          if (!token) {
            throw new Error(
              "Trello authorization succeeded, but no token was returned."
            );
          }

          /*
           * Remove the New Message label using
           * Trello's REST API directly.
           *
           * Trello documents:
           *
           * DELETE /cards/{id}/idLabels/{idLabel}
           */
          setStatus(
            'Removing "' + labelName + '"...'
          );

          const url =
            "https://api.trello.com/1/cards/" +
            encodeURIComponent(card.id) +
            "/idLabels/" +
            encodeURIComponent(label.id) +
            "?key=" +
            encodeURIComponent(POWERUP_APP_KEY) +
            "&token=" +
            encodeURIComponent(token);

          const response =
            await fetch(url, {
              method: "DELETE"
            });

          if (!response.ok) {
            let details = "";

            try {
              details =
                await response.text();
            } catch (_) {
              // Ignore response-body parsing failure.
            }

            throw new Error(
              "Trello API returned HTTP " +
                response.status +
                (details ? ": " + details : "")
            );
          }

          /*
           * Success.
           */
          setStatus(
            "Marked as read."
          );

          button.textContent =
            "Done";

          /*
           * Tell Trello to refresh the parent UI.
           */
          if (
            typeof t.notifyParent ===
            "function"
          ) {
            await t.notifyParent(
              "done"
            );
          }

        } catch (error) {
          console.error(
            "[" + labelName + " Mark Read] error:",
            error
          );

          setStatus(
            "Error: " +
              (
                error &&
                error.message
                  ? error.message
                  : String(error)
              )
          );

          button.disabled = false;
        }
      }

      whatsappButton.addEventListener(
        "click",
        function () {
          run("WhatsApp", whatsappButton);
        }
      );

      outlookButton.addEventListener(
        "click",
        function () {
          run("Outlook", outlookButton);
        }
      );

    })();
  </script>

</body>
</html>
