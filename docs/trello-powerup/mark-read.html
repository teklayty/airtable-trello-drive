<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark Read</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           margin: 0; padding: 16px; }
    button { width: 100%; padding: 9px 12px; border: 0; border-radius: 3px;
             cursor: pointer; background: #0c66e4; color: #fff; font-weight: 600; }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin-bottom: 12px; line-height: 1.35; }
  </style>
</head>
<body>
  <div id="status">Click the button to mark this card as read.</div>
  <button id="mark-read" type="button">Mark Read</button>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script>
    (function () {
      "use strict";

      const POWERUP_APP_NAME = "WhatsApp New Message - Mark Read";
      const POWERUP_APP_KEY = "99fb195773ddc1e3bfbd79de31dd8647";
      const NEW_MESSAGE_LABEL_NAME = "New Message";

      const t = window.TrelloPowerUp.iframe({
        appKey: POWERUP_APP_KEY,
        appName: POWERUP_APP_NAME
      });

      const status = document.getElementById("status");
      const button = document.getElementById("mark-read");

      function setStatus(text) {
        status.textContent = text;
      }

      async function run() {
        button.disabled = true;
        setStatus("Checking the card...");

        try {
          const card = await t.card("id", "labels");
          const labels = Array.isArray(card.labels) ? card.labels : [];
          const label = labels.find(function (item) {
            return item &&
              typeof item.name === "string" &&
              item.name.trim().toLowerCase() ===
                NEW_MESSAGE_LABEL_NAME.toLowerCase();
          });

          if (!label || !label.id) {
            setStatus('The "New Message" label is already absent.');
            button.disabled = false;
            return;
          }

          setStatus("Checking authorization...");

          const rest = await t.getRestApi();
          let authorized = await rest.isAuthorized();

          if (!authorized) {
            setStatus("Authorization is required. Please complete the Trello authorization popup.");
            await rest.authorize({
              scope: "read,write",
              expiration: "never"
            });
            authorized = await rest.isAuthorized();
          }

          if (!authorized) {
            setStatus("Authorization was not completed.");
            button.disabled = false;
            return;
          }

          setStatus("Removing the New Message label...");

          await rest.del(
            "/cards/" +
              encodeURIComponent(card.id) +
              "/idLabels/" +
              encodeURIComponent(label.id)
          );

          setStatus("Marked as read.");
          button.textContent = "Done";
          await t.notifyParent("done");
        } catch (error) {
          console.error("[WhatsApp Mark Read] error:", error);
          setStatus(
            "Error: " +
              (error && error.message ? error.message : String(error))
          );
          button.disabled = false;
        }
      }

      button.addEventListener("click", run);
    })();
  </script>
</body>
</html>
