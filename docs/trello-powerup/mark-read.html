<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark Read</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      color: #172b4d;
      background: #fff;
    }

    #status {
      margin-bottom: 14px;
      line-height: 1.4;
      font-size: 14px;
    }

    #mark-read {
      width: 100%;
      padding: 10px 14px;
      border: 0;
      border-radius: 3px;
      background: #0c66e4;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    #mark-read:hover {
      background: #0055cc;
    }

    #mark-read:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>

<body>

  <div id="status">
    Click <strong>Mark Read</strong> to remove the "New Message" label.
  </div>

  <button id="mark-read" type="button">
    Mark Read
  </button>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    (function () {
      "use strict";

      const POWERUP_APP_NAME = "WhatsApp New Message - Mark Read";
      const POWERUP_APP_KEY = "99fb195773ddc1e3bfbd79de31dd8647";
      const NEW_MESSAGE_LABEL_NAME = "New Message";

      const status = document.getElementById("status");
      const button = document.getElementById("mark-read");

      const t = window.TrelloPowerUp.iframe({
        appKey: POWERUP_APP_KEY,
        appName: POWERUP_APP_NAME
      });

      function setStatus(message) {
        status.textContent = message;
      }

      function findNewMessageLabel(labels) {
        if (!Array.isArray(labels)) {
          return null;
        }

        return (
          labels.find(function (label) {
            return (
              label &&
              typeof label.name === "string" &&
              label.name.trim().toLowerCase() ===
                NEW_MESSAGE_LABEL_NAME.toLowerCase()
            );
          }) || null
        );
      }

      async function run() {
        button.disabled = true;
        setStatus("Checking the card...");

        try {
          const card = await t.card("id", "name", "labels");

          if (!card || !card.id) {
            throw new Error("Could not determine the current Trello card.");
          }

          const label = findNewMessageLabel(card.labels);

          if (!label || !label.id) {
            setStatus(
              'The "New Message" label is already absent from this card.'
            );
            button.disabled = false;
            return;
          }

          /*
           * getRestApi() returns a Promise.
           */
          setStatus("Connecting to Trello...");

          const rest = await t.getRestApi();

          /*
           * Check whether this member has already authorized
           * the Power-Up.
           */
          let authorized = await rest.isAuthorized();

          /*
           * This call is reached directly from the user's click
           * on the Mark Read button inside this popup.
           */
          if (!authorized) {
            setStatus("Opening Trello authorization...");

            await rest.authorize({
              scope: "read,write",
              expiration: "never"
            });

            authorized = await rest.isAuthorized();
          }

          if (!authorized) {
            throw new Error("Trello authorization was not completed.");
          }

          setStatus('Removing "New Message"...');

          await rest.del(
            "/cards/" +
              encodeURIComponent(card.id) +
              "/idLabels/" +
              encodeURIComponent(label.id)
          );

          setStatus("Marked as read.");
          button.textContent = "Done";

          if (typeof t.notifyParent === "function") {
            await t.notifyParent("done");
          }

        } catch (error) {
          console.error("[WhatsApp Mark Read] error:", error);

          setStatus(
            "Error: " +
              (
                error && error.message
                  ? error.message
                  : String(error)
              )
          );

          button.disabled = false;
        }
      }

      button.addEventListener("click", run);
    })();
  </script>

</body>
</html>
