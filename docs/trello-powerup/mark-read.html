<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark Read</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      color: #172b4d;
    }

    #status {
      margin-bottom: 14px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      padding: 10px 14px;
      border: 0;
      border-radius: 3px;
      background: #0c66e4;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>

<body>

  <div id="status">
    Ready.
  </div>

  <button id="mark-read" type="button">
    Mark Read
  </button>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    (function () {
      "use strict";

      const POWERUP_APP_NAME =
        "WhatsApp New Message - Mark Read";

      const POWERUP_APP_KEY =
        "99fb195773ddc1e3bfbd79de31dd8647";

      const NEW_MESSAGE_LABEL_NAME = "New Message";

      const status = document.getElementById("status");
      const button = document.getElementById("mark-read");

      const t = window.TrelloPowerUp.iframe({
        appKey: POWERUP_APP_KEY,
        appName: POWERUP_APP_NAME
      });

      function setStatus(message) {
        status.textContent = message;
      }

      function findNewMessageLabel(labels) {
        if (!Array.isArray(labels)) {
          return null;
        }

        return labels.find(function (label) {
          return (
            label &&
            typeof label.name === "string" &&
            label.name.trim().toLowerCase() ===
              NEW_MESSAGE_LABEL_NAME.toLowerCase()
          );
        }) || null;
      }

      async function markRead() {
        button.disabled = true;

        try {
          setStatus("Reading card information...");

          const card = await t.card("id", "name", "labels");

          if (!card || !card.id) {
            throw new Error(
              "Could not determine the current Trello card."
            );
          }

          const label = findNewMessageLabel(card.labels);

          if (!label || !label.id) {
            setStatus(
              'The "New Message" label is not present on this card.'
            );
            button.disabled = false;
            return;
          }

          setStatus("Checking authorization...");

          const rest = await t.getRestApi();

          const authorized = await rest.isAuthorized();

          if (!authorized) {
            setStatus("Authorization required...");

            /*
             * IMPORTANT:
             * This authorization call happens directly from
             * the user's click on this button.
             */
            await rest.authorize({
              scope: "read,write",
              expiration: "never"
            });
          }

          setStatus('Removing "New Message"...');

          await rest.del(
            "/cards/" +
              encodeURIComponent(card.id) +
              "/idLabels/" +
              encodeURIComponent(label.id)
          );

          setStatus("Marked as read.");
          button.textContent = "Done";

          if (typeof t.notifyParent === "function") {
            await t.notifyParent("done");
          }

        } catch (error) {
          console.error(
            "[WhatsApp Mark Read] error:",
            error
          );

          setStatus(
            "Error: " +
            (
              error && error.message
                ? error.message
                : String(error)
            )
          );

          button.disabled = false;
        }
      }

      button.addEventListener("click", markRead);
    })();
  </script>

</body>
</html>
