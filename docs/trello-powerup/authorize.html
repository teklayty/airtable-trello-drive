<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authorize Mark Read</title>
</head>
<body>
  <p>Authorize this Power-Up to remove the New Message label.</p>
  <button id="authorize" type="button">Authorize</button>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script>
    (function () {
      "use strict";

      const POWERUP_APP_NAME = "WhatsApp New Message - Mark Read";
      const POWERUP_APP_KEY = "99fb195773ddc1e3bfbd79de31dd8647";

      const t = window.TrelloPowerUp.iframe({
        appKey: POWERUP_APP_KEY,
        appName: POWERUP_APP_NAME
      });

      document.getElementById("authorize").addEventListener("click", function () {
        const button = document.getElementById("authorize");
        button.disabled = true;
        button.textContent = "Authorizing...";

        t.getRestApi()
          .then(function (rest) {
            return rest.authorize({
              scope: "read,write",
              expiration: "never"
            });
          })
          .then(function () {
            return t.alert({
              message: "Authorization completed. Close this popup and click Mark Read again."
            });
          })
          .then(function () {
            return t.closePopup();
          })
          .catch(function (error) {
            console.error("[WhatsApp Mark Read] authorization error:", error);
            button.disabled = false;
            button.textContent = "Authorize";

            return t.alert({
              message:
                "Authorization failed: " +
                (error && error.message ? error.message : String(error))
            });
          });
      });
    })();
  </script>
</body>
</html>
